<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Hunscope · ส่องตลาดหุ้นเทค</title>
<meta name="description" content="ส่องตลาดหุ้นเทค ข่าว พื้นฐาน และสถานการณ์ในที่เดียว">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔭%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--panel:#131a24;--hover:#18212e;--line:#222c3a;--ink:#e6edf3;--mute:#8b97a8;--up:#3fb68b;--down:#f0616d;--warn:#d9a441;--accent:#58a6ff}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "IBM Plex Sans Thai",system-ui,sans-serif}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav{position:sticky;top:0;z-index:5;display:flex;gap:20px;align-items:center;padding:10px max(16px,calc((100% - 1040px)/2));background:rgba(13,17,23,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .logo{font-weight:700;font-size:1.2rem;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
.links{display:flex;gap:18px;margin-left:auto;white-space:nowrap}
nav .links a{text-decoration:none;color:var(--mute);font-size:.92rem;padding:8px 0}
nav .links a:hover{color:var(--ink)}
.srch{position:relative;flex:0 1 280px}
.srch input{width:100%;min-height:40px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font:inherit;font-size:.92rem}
.srch input::placeholder{color:var(--mute)}
.qres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.qres[hidden]{display:none}
.qres button{display:flex;justify-content:space-between;gap:10px;width:100%;background:none;border:0;border-top:1px solid var(--line);color:var(--ink);padding:10px 14px;font:inherit;font-size:.92rem;text-align:left;cursor:pointer}
.qres button:first-child{border-top:0}
.qres button:hover,.qres button:focus-visible{background:var(--hover)}
.qres .flat{padding:10px 14px;font-size:.9rem}
section[id]{scroll-margin-top:84px}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.hero{background:radial-gradient(900px 360px at 12% 0,rgba(88,166,255,.14),transparent 70%),linear-gradient(var(--bg),var(--bg));border-bottom:1px solid var(--line)}
.hero .wrap{padding-top:56px;padding-bottom:40px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px 32px;align-items:center}
.hero .sub{margin:0}
.pills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pill{display:block;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:64px;transition:border-color .15s,background .15s}
.pill:hover,.pill:focus-visible{border-color:var(--accent);background:var(--hover)}
.pill small{display:block;color:var(--mute);font-size:.82rem}
.pill strong{font-size:1.2rem;font-variant-numeric:tabular-nums}
.idx{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ic{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.ic .t{display:flex;justify-content:space-between;gap:6px;align-items:baseline;font-size:.82rem;color:var(--mute)}
.ic .t b{color:var(--ink);font-weight:500;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic .p{font-size:1.25rem;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:4px}
.ic .c{display:flex;align-items:center;gap:8px;font-size:.9rem;font-variant-numeric:tabular-nums;margin-top:2px}
.ic .c small{color:var(--mute);font-size:.78rem}
.ic svg.sp{width:100%;height:40px;margin-top:6px}
.ic svg.sp polyline{vector-effect:non-scaling-stroke}
.strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:8px}
.nc{flex:0 0 260px;scroll-snap-align:start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;display:flex;flex-direction:column;gap:6px}
.nc:hover,.nc:focus-visible{border-color:var(--accent)}
.nc small{color:var(--mute);font-size:.8rem}
.nc .tt{font-weight:500;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nc .why{color:var(--mute);font-size:.88rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.hd a{color:var(--accent);font-size:.9rem;text-decoration:none}
#stocks th:nth-child(2){text-align:left}
tr.gh td{background:var(--hover);color:var(--mute);font-size:.82rem;padding:8px 16px;text-align:left;border-top:1px solid var(--line)}
.tabs button,.calc button,.pfc button{min-height:40px}
.calc input,.pfc input,.pfc select{min-height:40px}
h1{font-size:clamp(2rem,5.5vw,3.4rem);line-height:1.2;margin:0 0 14px;max-width:16em;letter-spacing:-.01em}
.sub{color:var(--mute);max-width:46em;margin:0 0 32px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stats div{background:var(--panel);padding:14px 16px}
.stats small{display:block;color:var(--mute);font-size:.82rem}
.stats strong{font-size:1.3rem;font-variant-numeric:tabular-nums}
section{padding:44px 0 0}
h2{font-size:1.25rem;margin:0 0 4px}
.note{color:var(--mute);font-size:.9rem;margin:0 0 14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) 120px 110px;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sym{color:var(--mute);font-size:.85rem;font-weight:400;margin-left:6px}
svg.sp{width:120px;height:36px;display:block}
.num{text-align:right;font-variant-numeric:tabular-nums}
.price{font-weight:700;color:var(--ink)}
.chg{font-size:.9rem}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--mute)}.warn{color:var(--warn)}.cool{color:var(--accent)}
.scroll{overflow-x:auto}
table{width:100%;min-width:760px;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--mute);font-size:.85rem;text-align:right;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:11px 12px;text-align:right;border-top:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;padding-left:16px}
tr[data-sym]{cursor:pointer}
tr[data-sym]:hover,tr[data-sym]:focus-visible{background:var(--hover)}
.bar{position:relative;width:90px;height:4px;background:var(--line);border-radius:2px;margin-left:auto}
.bar i{position:absolute;top:-3px;width:3px;height:10px;background:var(--ink);border-radius:1px}
.chip{display:inline-block;padding:1px 10px;border-radius:999px;border:1px solid currentColor;font-size:.82rem}
.news{display:block;padding:12px 16px;border-top:1px solid var(--line);text-decoration:none}
.news:first-child{border-top:0}
.news:hover{background:var(--hover)}
.news small{display:block;color:var(--mute);font-size:.82rem}
.tag{color:var(--accent);margin-right:6px}
footer{color:var(--mute);font-size:.85rem;padding:44px 0 56px}
dialog{width:min(640px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:0}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dh{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 20px 8px}
.dh h3{margin:0;font-size:1.3rem}
.dh button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:4px 12px;font:inherit;cursor:pointer}
.db{padding:0 20px 20px}
.db h4{margin:20px 0 6px;font-size:1rem}
.db svg.big{width:100%;height:auto;display:block}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px 16px}
.kv small{display:block;color:var(--mute);font-size:.8rem}
.sg{list-style:none;margin:0;padding:0}
.sg li{padding:6px 0;border-top:1px solid var(--line);display:flex;gap:10px}
.sg li:first-child{border-top:0}
.msg{padding:16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.tabs button{background:none;border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:4px 14px;font:inherit;font-size:.9rem;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--accent);background:var(--hover)}
.nt{min-width:820px}.nt th,.nt td{text-align:left;vertical-align:top}
.nt a{text-decoration:none;font-weight:500}.nt a:hover{text-decoration:underline}
.nt small{display:block;color:var(--mute);font-size:.82rem;font-weight:400}
.nt .tm{white-space:nowrap;color:var(--mute)}
.gauge{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line);margin:8px 0 12px}
.g-up{background:var(--up)}.g-flat{background:var(--mute);opacity:.5}.g-down{background:var(--down)}
.an{padding:18px 20px}.an p{margin:0 0 10px}.an h3{font-size:1rem;margin:16px 0 6px}.an ul{margin:0;padding-left:1.2em}.an li{margin:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:.85rem;color:var(--mute)}
.chips .up{color:var(--up)}.chips .down{color:var(--down)}
.zt,.ft{min-width:840px}.zt th,.zt td,.ft th,.ft td{text-align:left}
.ai{background:var(--hover);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0}.ai p{margin:0 0 6px}
.qt{min-width:0;width:100%;font-size:.88rem}.qt th,.qt td{padding:6px 8px;text-align:right}.qt th:first-child,.qt td:first-child{text-align:left;padding-left:0}
.sg .grp{color:var(--mute);font-size:.85rem;padding-top:10px}
.mc{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;margin-top:12px}
.mc>div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.mc h3{font-size:1rem;margin:0 0 4px}.mc p{margin:8px 0;font-size:.92rem}.mc small{color:var(--mute)}
.ctx{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.ctx span{border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:.88rem;background:var(--panel)}
.calc{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin:12px 0}
.calc label{display:block;font-size:.85rem;color:var(--mute)}
.calc input{width:120px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
.calc button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.calc button:hover{border-color:var(--accent)}
.mt{min-width:0}.mt th,.mt td{text-align:left}
.meter{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--up),var(--warn),var(--down));margin:12px 0 4px}
.meter i{position:absolute;top:-4px;width:4px;height:18px;background:var(--ink);border-radius:2px;transform:translateX(-2px)}
.mlab{display:flex;justify-content:space-between;color:var(--mute);font-size:.8rem}
.bt{min-width:0;font-size:.92rem}.bt th,.bt td{text-align:left;vertical-align:top}.bt td small{display:block;color:var(--mute);font-size:.82rem}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:12px}
.two>div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.two h3{font-size:1rem;margin:0 0 6px}.two ul{margin:0;padding-left:1.1em}.two li{margin:5px 0;font-size:.92rem}
.pfc{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.pfc label{display:block;font-size:.85rem;color:var(--mute)}
.pfc input,.pfc select,.pfr input[type=number]{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
.pfc input{width:130px}
.pfc button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:5px 14px;font:inherit;font-size:.88rem;cursor:pointer}
.pfc button:hover{border-color:var(--accent)}
.pfg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 18px;margin-top:14px}
.pfr{display:grid;grid-template-columns:22px minmax(0,1fr) 84px;align-items:center;gap:8px;padding:4px 0}
.pfr input[type=number]{width:84px;padding:4px 6px}
.pfr label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pfo{margin-top:14px}.pfo svg{width:100%;height:auto;display:block}
.pfo .leg{display:flex;flex-wrap:wrap;gap:14px;font-size:.85rem;margin:8px 0 2px}
.pfo ul{margin:8px 0 0;padding-left:1.2em}.pfo li{margin:4px 0;font-size:.92rem}
.bd{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:.82rem;font-weight:500;border:1px solid currentColor;background:color-mix(in srgb,currentColor 12%,transparent)}
.ic .pr{font-size:.8rem;color:var(--mute);margin-top:6px}
.ic .pr b{font-weight:500}
.ic svg.sp{margin-top:2px}
.ic svg.sp path{stroke:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;color:var(--mute);padding:6px 14px;font:inherit;font-size:.85rem;cursor:pointer;min-height:36px}
.seg button[aria-pressed=true]{background:var(--hover);color:var(--ink)}
.hdr{display:flex;align-items:center;gap:14px}
.nav2{display:flex;gap:6px}
.nav2 button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font-size:1.1rem;line-height:1}
.nav2 button:hover{border-color:var(--accent)}
@media (hover:none){.nav2{display:none}}
.qres button.on{background:var(--hover)}
.sk{position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);transform:translateX(-100%);animation:sh 1.4s infinite}
@keyframes sh{to{transform:translateX(100%)}}
.ic.sk{min-height:132px}
@media (prefers-reduced-motion:reduce){.sk::after{animation:none}}
@media (max-width:820px){nav{flex-wrap:wrap;gap:8px 12px}.srch{flex:1 1 160px}.links{order:3;width:100%;margin-left:0;overflow-x:auto;gap:16px}section[id]{scroll-margin-top:112px}.hero .wrap{grid-template-columns:1fr}.idx{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.row{grid-template-columns:minmax(0,1fr) 80px 96px}svg.sp{width:80px}.nc{flex-basis:78%}.pill strong{font-size:1.1rem}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

<script>
const fmt=(n,d=2)=>n==null?"–":Number(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cls=n=>n==null?"flat":n>=0?"up":"down";
const sg=n=>n>=0?"+":"";
const chg=d=>d.unit==="pt"?`${sg(d.change)}${fmt(d.change)} จุด`:`${sg(d.pct)}${fmt(d.pct)}%`;
const lab={ขาขึ้น:"up",ขาลง:"down",เป็นกลาง:"flat"};
const rec={strong_buy:"ซื้อแรง",buy:"ซื้อ",hold:"ถือ",underperform:"ต่ำกว่าตลาด",sell:"ขาย",strong_sell:"ขายแรง"};
const big=n=>n>=1e12?fmt(n/1e12)+" ล้านล้าน":n>=1e9?fmt(n/1e9,1)+" พันล้าน":fmt(n/1e6,0)+" ล้าน";
function ago(t){const m=(Date.now()-new Date(t))/6e4;if(!(m>=0))return"";if(m<60)return Math.max(1,Math.round(m))+" นาทีที่แล้ว";if(m<1440)return Math.round(m/60)+" ชม.ที่แล้ว";return Math.round(m/1440)+" วันที่แล้ว"}

function spark(v){
  const w=120,h=36,min=Math.min(...v),max=Math.max(...v),r=max-min||1;
  const p=v.map((y,i)=>`${(i/(v.length-1)*w).toFixed(1)},${(h-2-(y-min)/r*(h-4)).toFixed(1)}`).join(" ");
  return `<svg class="sp" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${p}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function bigChart(d){
  const v=d.series,w=600,h=200,min=Math.min(...v),max=Math.max(...v),r=max-min||1,y=n=>h-6-(n-min)/r*(h-12);
  const p=v.map((n,i)=>`${(i/(v.length-1)*w).toFixed(1)},${y(n).toFixed(1)}`).join(" ");
  const bands=zs=>(zs||[]).filter(z=>z.high>=min&&z.low<=max).map(z=>{const t=y(Math.min(z.high,max));return `<rect x="0" width="${w}" y="${t}" height="${Math.max(2,y(Math.max(z.low,min))-t)}" fill="#58a6ff" opacity=".16"/>`}).join("");
  const ref=(val,c,t)=>val!=null&&val>=min&&val<=max?`<line x1="0" x2="${w}" y1="${y(val)}" y2="${y(val)}" stroke="${c}" stroke-dasharray="4 4" opacity=".7"/><text x="${w-4}" y="${y(val)-4}" fill="${c}" font-size="11" text-anchor="end">${t}</text>`:"";
  return `<svg class="big ${cls(v[v.length-1]-v[0])}" viewBox="0 0 ${w} ${h}" role="img" aria-label="กราฟราคา 90 วัน">${bands((d.zones||{}).list)}<polyline points="${p}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>${ref(d.sma50,"#58a6ff","SMA50")}${ref(d.sma200,"#d9a441","SMA200")}</svg>`;
}
function row(d){

const MFAC=["oil","rates","infl","gold","trade"];
const est=(s,sh)=>(s.b_oil||0)*(sh.oil||0)+(s.b_y||0)*(sh.dy||0);
const rel=(s,sh)=>{const t=Math.max(0,sh.oil?Math.abs(s.t_oil||0):0,sh.dy?Math.abs(s.t_y||0):0);return t>=2?"ชัด":t>=1.5?"พอมี":"อ่อน"};
function impact(sens,sh){
  if(!sh||(!sh.oil&&!sh.dy))return"";
  const l=sens.filter(s=>!s.symbol.startsWith("^")).map(s=>({s,e:est(s,sh),r:rel(s,sh)})).filter(x=>x.r!=="อ่อน").sort((a,b)=>Math.abs(b.e)-Math.abs(a.e)).slice(0,4);
  const ix=sens.find(s=>s.symbol==="^IXIC");
  return `<p><small>ประมาณจากความสัมพันธ์ย้อนหลัง 1 ปี (ในวงเล็บคือความชัดของความสัมพันธ์):</small></p>`+(l.length?`<div class="chips">${l.map(x=>`<span class="${sc(x.e)}">${esc(x.s.symbol)} ${pcs(x.e,1)} (${x.r})</span>`).join("")}</div>`:`<p class="flat">ปีที่ผ่านมาไม่พบความสัมพันธ์ชัดเจนกับหุ้นที่ติดตามในปัจจัยนี้</p>`)+(ix?`<p><small>Nasdaq โดยรวม ${pcs(est(ix,sh),1)}</small></p>`:"");
}
function macroNow(k,mc){

  if(k==="infl"){const p=c.cpi;return p?`CPI ล่าสุด (${p.month}) ${fmt(p.yoy,1)}% YoY${p.core_yoy!=null?` และ core ${fmt(p.core_yoy,1)}%`:""}`:"ยังไม่มีข้อมูล CPI (ดึงจาก FRED ไม่ได้)"}

  return "ไม่มีตัวเลขอัตโนมัติสำหรับหัวข้อนี้ ดูข่าวในตารางข่าวประกอบ";
}
function drawFactor(k,mc){
  const p=PB[k],sens=(mc||{}).sens||[],names=Object.fromEntries(sens.map(s=>[s.symbol,s.name]));

  const tags=(p.tags||[]).filter(t=>names[t]);
  const cards=p.scen.map(s=>`<div><h3>${esc(s.t)}</h3><small>${esc(s.c)}</small><p>${esc(s.m)}</p>${s.shock?impact(sens,s.shock):""}${tags.length?`<p><small>หุ้นที่ติดตามและอยู่ในธุรกิจชิป (ระดับผลกระทบต่างกันตามบริษัท):</small></p><div class="chips">${tags.map(t=>`<span>${esc(t)}</span>`).join("")}</div>`:""}<p><small>ควรจับตา: ${esc(s.w)}</small></p></div>`).join("");

function calcRows(mc,o,y){
  const sens=(mc||{}).sens||[];
  if(!sens.length)return `<tr><td colspan="3" class="flat">ยังไม่มีข้อมูลความอ่อนไหว</td></tr>`;
  const sh={oil:o,dy:y},none=!o&&!y;
  return sens.map(s=>({s,e:none?0:est(s,sh)})).sort((a,b)=>b.e-a.e).map(({s,e})=>`<tr><td>${esc(s.name)}<span class="sym">${esc(s.symbol)}</span></td><td class="${sc(e)}"><b>${pcs(e,2)}</b></td><td class="flat">R² ${fmt(s.r2,2)} • ${none?"–":rel(s,sh)}</td></tr>`).join("");
}

function bindMacro(data){
  const mc=data.macro,body=document.getElementById("macroBody");
  if(!body)return;
  const draw=k=>{body.innerHTML=drawFactor(k,mc)};
  draw("oil");
  document.querySelectorAll("#macroTabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#macroTabs button").forEach(x=>x.setAttribute("aria-selected",x===b));draw(b.dataset.f)});
  const run=()=>{mRes.innerHTML=calcRows(mc,parseFloat(mOil.value)||0,parseFloat(mY.value)||0)};
  mOil.oninput=run;mY.oninput=run;
  document.querySelectorAll("[data-pre]").forEach(b=>b.onclick=()=>{const[o,y]=b.dataset.pre.split(",");mOil.value=o;mY.value=y;run()});
  run();
}

function pfCalc(data,w,amt,yrs,reb){
  const h=data.hist,D=h.dates,N=D.length,syms=Object.keys(w),notes=[];
  const names=Object.fromEntries(data.groups.flatMap(g=>g.items.map(i=>[i.symbol,i.name])));
  const first=s=>h.series[s].findIndex(v=>v!=null);
  let i0=Math.max(0,N-1-yrs*52);
  const lim=syms.map(s=>[s,first(s)]).sort((a,b)=>b[1]-a[1])[0];
  if(lim[1]>i0){i0=lim[1];notes.push(`ข้อมูลของ ${esc(names[lim[0]]||lim[0])} เริ่มเมื่อ ${D[lim[1]]} จึงย่อช่วงย้อนหลังลงตามนั้น`)}
  const weeks=N-1-i0;
  if(weeks<8)return `<div class="box msg">ข้อมูลร่วมของหุ้นที่เลือกสั้นเกินไปที่จะคำนวณ (ต้องมีอย่างน้อย 8 สัปดาห์)</div>`;
  const fill=s=>{let p=null;return h.series[s].slice(i0).map(v=>{if(v!=null)p=v;return p})};
  const P=Object.fromEntries(syms.map(s=>[s,fill(s)])),n=weeks+1;
  const tw=syms.reduce((a,s)=>a+w[s],0),W=Object.fromEntries(syms.map(s=>[s,w[s]/tw]));
  const units={},set=(i,V)=>syms.forEach(s=>units[s]=V*W[s]/P[s][i]);
  set(0,amt);const val=[];
  for(let i=0;i<n;i++){const V=syms.reduce((a,s)=>a+units[s]*P[s][i],0);if(reb&&i>0&&i%52===0)set(i,V);val.push(V)}
  const years=(new Date(D[N-1])-new Date(D[i0]))/(365.25*864e5);
  const cagr=v=>(Math.pow(v[v.length-1]/v[0],1/years)-1)*100,tot=v=>(v[v.length-1]/v[0]-1)*100;
  const vol=v=>{const r=[];for(let i=1;i<v.length;i++)r.push(v[i]/v[i-1]-1);const m=r.reduce((a,b)=>a+b,0)/r.length;return Math.sqrt(r.reduce((a,b)=>a+(b-m)**2,0)/(r.length-1))*Math.sqrt(52)*100};
  const mdd=v=>{let pk=v[0],m=0;v.forEach(x=>{pk=Math.max(pk,x);m=Math.min(m,x/pk-1)});return m*100};
  const bench=(sym,nm,c,d)=>{const a=h.series[sym];if(!a||a[i0]==null)return null;let p=a[i0];const v=a.slice(i0).map(x=>{if(x!=null)p=x;return amt*p/a[i0]});return {n:nm,v,c,d}};
  const bs=[bench("^IXIC","Nasdaq","#8b97a8"),bench("^GSPC","S&P 500","#d9a441",1)].filter(Boolean);
  const all=[{n:"พอร์ตจำลอง",v:val,c:"#58a6ff",sw:2.2},...bs];
  const row=l=>`<tr><td>${esc(l.n)}</td><td class="${sc(cagr(l.v))}"><b>${pcs(cagr(l.v),1)}</b></td><td class="${sc(tot(l.v))}">${pcs(tot(l.v),1)}</td><td>${fmt(vol(l.v),1)}%</td><td class="down">${fmt(mdd(l.v),1)}%</td><td>${fmt(l.v[l.v.length-1],0)}</td></tr>`;
  const warn=[...notes];
  if(years<1)warn.push(`ช่วงข้อมูลสั้นกว่า 1 ปี (${fmt(years,2)} ปี) การแปลงเป็น % ต่อปีอาจให้ตัวเลขที่ไม่สมจริง ดูผลตอบแทนรวมประกอบ`);
  const top=syms.slice().sort((a,b)=>W[b]-W[a])[0];
  if(W[top]>0.4)warn.push(`${esc(names[top]||top)} มีสัดส่วน ${fmt(W[top]*100,0)}% พอร์ตพึ่งหุ้นตัวเดียวมาก`);
  if(syms.length<5)warn.push("เลือกหุ้นน้อยกว่า 5 ตัว ความผันผวนมักสูงกว่าพอร์ตที่กระจายกว่านี้");
  const chip=syms.filter(s=>PB.trade.tags.includes(s)).reduce((a,s)=>a+W[s],0);
  if(chip>0.6)warn.push(`หุ้นกลุ่มชิปมีสัดส่วน ${fmt(chip*100,0)}% หุ้นกลุ่มเดียวกันมักขึ้นลงพร้อมกัน การกระจายจึงน้อยกว่าที่จำนวนตัวบอก`);
  const stk=syms.map(s=>{const a=P[s],t=(a[n-1]/a[0]-1)*100,c=(Math.pow(a[n-1]/a[0],1/years)-1)*100;return `<tr><td>${esc(names[s]||s)}<span class="sym">${esc(s)}</span></td><td>${fmt(W[s]*100,1)}%</td><td class="${sc(c)}">${pcs(c,1)}</td><td class="${sc(t)}">${pcs(t,1)}</td></tr>`}).join("");
  const diff=bs[0]?cagr(val)-cagr(bs[0].v):null;
  return `<div class="stats" style="margin-bottom:14px"><div><small>ผลตอบแทนต่อปี (CAGR)</small><strong class="${sc(cagr(val))}">${pcs(cagr(val),1)}</strong></div><div><small>ผลตอบแทนรวม ${fmt(years,1)} ปี</small><strong class="${sc(tot(val))}">${pcs(tot(val),1)}</strong></div><div><small>มูลค่าสิ้นสุด (USD)</small><strong>${fmt(val[n-1],0)}</strong></div><div><small>ผันผวนต่อปี</small><strong>${fmt(vol(val),1)}%</strong></div><div><small>ลดลงสูงสุด (รายสัปดาห์)</small><strong class="down">${fmt(mdd(val),1)}%</strong></div>${diff==null?"":`<div><small>เทียบ Nasdaq ต่อปี</small><strong class="${sc(diff)}">${pcs(diff,1)}</strong></div>`}</div>
  ${warn.length?`<div class="box an" style="margin-bottom:14px"><b class="warn">ข้อควรระวัง</b><ul>${warn.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:""}
  <div class="box an">${pfChart(all)}<p class="note" style="margin:6px 0 0">${D[i0]} ถึง ${D[N-1]} • เริ่มที่ ${fmt(amt,0)} USD ${reb?"ปรับสมดุลทุก 52 สัปดาห์":"ซื้อแล้วถือ"}</p></div>
  <h3 style="margin:18px 0 6px;font-size:1.05rem">เทียบกับดัชนี</h3><div class="box scroll"><table class="bt"><thead><tr><th></th><th>ต่อปี</th><th>รวม</th><th>ผันผวนต่อปี</th><th>ลดลงสูงสุด</th><th>มูลค่าสิ้นสุด</th></tr></thead><tbody>${all.map(row).join("")}</tbody></table></div>
  <h3 style="margin:18px 0 6px;font-size:1.05rem">รายตัวในพอร์ต</h3><div class="box scroll"><table class="bt"><thead><tr><th>หุ้น</th><th>สัดส่วนเริ่มต้น</th><th>ต่อปี</th><th>รวม</th></tr></thead><tbody>${stk}</tbody></table></div>
  <p class="note" style="margin-top:12px">หุ้นในรายการนี้เป็นหุ้นที่เลือกไว้ในวันนี้ ซึ่งหลายตัวเป็นผู้ชนะของช่วงที่ผ่านมา ผลย้อนหลังจึงมักดูดีกว่าที่ผู้ลงทุนจริงจะได้ในอนาคต ใช้ข้อมูลรายสัปดาห์ การลดลงสูงสุดรายวันอาจลึกกว่าที่แสดง ผลในอดีตไม่รับประกันอนาคต และนี่ไม่ใช่คำแนะนำการลงทุน</p>`;
}
function bindPortfolio(data){
  const h=data.hist,el=document.getElementById("pfList");
  if(!h||!el)return;
  const stocks=[...((data.groups.find(g=>g.detail===true)||{}).items||[]),...data.groups.flatMap(g=>g.items).filter(s=>s.symbol==="GLD")].filter(s=>h.series[s.symbol]);

  el.innerHTML=stocks.map(s=>`<div class="pfr"><input type="checkbox" id="pc_${esc(s.symbol)}" data-s="${esc(s.symbol)}"><label for="pc_${esc(s.symbol)}">${esc(s.name)}<span class="sym">${esc(s.symbol)}</span></label><input type="number" min="0" max="100" step="1" data-w="${esc(s.symbol)}" aria-label="สัดส่วน ${esc(s.name)} (%)" placeholder="%"></div>`).join("");

  if(st.amt)pfAmt.value=st.amt;if(st.yrs)pfYrs.value=st.yrs;if(st.reb!=null)pfReb.value=st.reb;

  const run=()=>{
    const w={};
    stocks.forEach(s=>{const v=parseFloat(q("w",s.symbol).value);if(q("s",s.symbol).checked&&v>0)w[s.symbol]=v});
    const amt=Math.max(100,parseFloat(pfAmt.value)||10000);
    pfSave({sel:w,amt:pfAmt.value,yrs:pfYrs.value,reb:pfReb.value});
    const t=Object.values(w).reduce((a,b)=>a+b,0);
    pfTot.textContent=t?`รวมสัดส่วน ${fmt(t,1)}%${Math.abs(t-100)>0.05?" (ระบบจะปรับให้รวมเป็น 100% ตามสัดส่วนที่ใส่)":""}`:"ยังไม่ได้เลือกหุ้น";
    pfOut.innerHTML=t?pfCalc(data,w,amt,parseInt(pfYrs.value),pfReb.value==="1"):`<div class="box msg flat">เลือกหุ้นอย่างน้อย 1 ตัวและใส่สัดส่วน (%) เพื่อดูผลย้อนหลัง</div>`;
  };
  el.addEventListener("input",e=>{const t=e.target;if(t.dataset.w)q("s",t.dataset.w).checked=parseFloat(t.value)>0;run()});
  el.addEventListener("change",e=>{const t=e.target;if(t.dataset.s){const i=q("w",t.dataset.s);if(t.checked&&!(parseFloat(i.value)>0))i.value=10;if(!t.checked)i.value="";run()}});
  pfEq.onclick=()=>{const on=stocks.filter(s=>q("s",s.symbol).checked);if(!on.length){pfTot.textContent="เลือกหุ้นก่อน แล้วจึงกดถ่วงเท่ากัน";return}const v=Math.round(1000/on.length)/10;on.forEach(s=>q("w",s.symbol).value=v);run()};
  pfClr.onclick=()=>{stocks.forEach(s=>{q("s",s.symbol).checked=false;q("w",s.symbol).value=""});run()};
  [pfAmt,pfYrs,pfReb].forEach(x=>x.addEventListener("input",run));
  run();
}

function stocksSection(g){

function bindSearch(stocks,openStock){
  const q=document.getElementById("q"),box=document.getElementById("qres");
  if(!q)return;
  q.placeholder="ค้นหาหุ้น ("+stocks.length+" ตัว)"+(window.matchMedia&&matchMedia("(hover:none)").matches?"":" · กด /");
  let cur=-1;
  const items=()=>[...box.querySelectorAll("[data-o]")];
  const mark=()=>items().forEach((b,i)=>b.classList.toggle("on",i===cur));
  const hide=()=>{box.hidden=true;box.innerHTML="";cur=-1};
  const pick=sym=>{openStock(sym);q.value="";hide()};
  q.addEventListener("input",()=>{
    const t=q.value.trim().toLowerCase();
    cur=-1;
    if(!t){hide();return}
    const r=stocks.filter(s=>s.symbol.toLowerCase().includes(t)||s.name.toLowerCase().includes(t)).slice(0,8);
    box.innerHTML=r.length?r.map(s=>`<button type="button" data-o="${esc(s.symbol)}"><span>${esc(s.name)} <span class="sym">${esc(s.symbol)}</span></span><span class="${cls(s.pct)}">${pcs(s.pct,2)}</span></button>`).join(""):`<div class="flat">ไม่พบหุ้นที่ค้นหา</div>`;
    box.hidden=false;
  });
  q.addEventListener("keydown",e=>{
    const l=items();
    if(e.key==="ArrowDown"&&l.length){e.preventDefault();cur=(cur+1)%l.length;mark()}
    else if(e.key==="ArrowUp"&&l.length){e.preventDefault();cur=(cur<=0?l.length:cur)-1;mark()}
    else if(e.key==="Escape"){q.value="";hide();q.blur()}
    else if(e.key==="Enter"){const b=l[cur>=0?cur:0];if(b)pick(b.dataset.o)}
  });
  box.addEventListener("click",e=>{const b=e.target.closest("[data-o]");if(b)pick(b.dataset.o)});
  document.addEventListener("click",e=>{if(!e.target.closest(".srch"))hide()});
  document.addEventListener("keydown",e=>{
    const tag=(document.activeElement||{}).tagName||"";
    if((e.key==="k"&&(e.ctrlKey||e.metaKey))||(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(tag))){e.preventDefault();q.focus();q.select()}
  });
}
function applyQuotes(data,qj){
  const base=new Date(data.updated).getTime();let n=0,mx=0;
  data.groups.forEach(g=>g.items.forEach(i=>{
    const q=qj.q[i.symbol];
    if(!q||q.price==null)return;
    const t=new Date(q.t).getTime();
    if(!(t>base))return;
    if(i.price!==q.price||i.change!==q.change){i.price=q.price;i.change=q.change;i.pct=q.pct;n++}
    mx=Math.max(mx,t);
  }));
  if(mx)data.liveAt=mx;
  return n>0;
}

function repaintRows(data){
  const m=Object.fromEntries(data.groups.flatMap(g=>g.items.map(i=>[i.symbol,i])));
  document.querySelectorAll("#stocks tr[data-sym], #zones tr[data-sym]").forEach(tr=>{
    const d=m[tr.dataset.sym];
    if(!d)return;
    const p=tr.querySelector("td.price");
    if(p)p.textContent=fmt(d.price);
    if(tr.closest("#stocks")){const c=tr.children;c[1].className=cls(d.change);c[3].className=cls(d.pct);c[3].textContent=sg(d.pct)+fmt(d.pct)+"%"}
  });
}
function startQuotes(data,onApply){
  let last="";
  const pull=()=>{
    if(document.hidden)return;
    fetch("quotes.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).then(qj=>{
      if(!qj||!qj.q||qj.updated===last)return;
      last=qj.updated;
      if(applyQuotes(data,qj))onApply(qj);
    }).catch(()=>{});
  };
  pull();setInterval(pull,300000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});
}

  const a=data.analysis||{},c=a.counts||{pos:0,neu:0,neg:0},t=(c.pos+c.neu+c.neg)||1,w=n=>(n/t*100).toFixed(1),ai=a.method==="claude";

fetch("data.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(data=>{
  const all=data.groups.flatMap(g=>g.items),by=s=>all.find(i=>i.symbol===s)||{},stocks=(data.groups.find(g=>g.detail===true)||{items:[]}).items;
  const paintTop=()=>{
  const nq=by("^IXIC"),sox=by("^SOX"),vix=by("^VIX");
  const t=nq.pct>=.3?"ตลาดเทคปรับขึ้น":nq.pct<=-.3?"ตลาดเทคปรับลง":"ตลาดเทคทรงตัว";
  const c=sox.pct<=-1?" ชิปถูกขายหนัก":sox.pct>=1?" ชิปนำตลาด":"";
  $h=document.getElementById("headline");$h.textContent=nq.pct==null?"Hunscope":t+c;

  document.getElementById("meta").textContent=data.liveAt?`ราคาระหว่างวัน ณ ${new Date(data.liveAt).toLocaleTimeString("th-TH",{timeZone:"Asia/Bangkok",hour:"2-digit",minute:"2-digit"})} น. (อาจล่าช้าราว 15 นาที) • ตัวชี้วัดและงบคำนวณจากข้อมูลปิดตลาด ${dates[dates.length-1]||"-"} (อัปเดต ${upd} เวลาไทย)`:`ราคาปิดล่าสุดของตลาดสหรัฐ ${dates[dates.length-1]||"-"} อัปเดตเมื่อ ${upd} (เวลาไทย)`;
  const above=stocks.filter(s=>s.sma50!=null&&s.price>s.sma50).length,bull=stocks.filter(s=>s.label==="ขาขึ้น").length;
  const nc=(data.analysis||{}).counts||{pos:0,neg:0};const SL={"Nasdaq":"#overview","เซมิคอนดักเตอร์":"#overview","VIX":"#overview","หุ้นเหนือ SMA50":"#stocks","สัญญาณขาขึ้น":"#stocks","ข่าวบวก / ลบ":"#analysis","ใกล้โซนรับ":"#zones"};const st=(k,v,c="")=>`<a class="pill" href="${SL[k]}"><small>${k}</small><strong class="${c}">${v}</strong></a>`;
  document.getElementById("stats").innerHTML=st("Nasdaq",nq.pct==null?"–":sg(nq.pct)+fmt(nq.pct)+"%",cls(nq.pct))+st("เซมิคอนดักเตอร์",sox.pct==null?"–":sg(sox.pct)+fmt(sox.pct)+"%",cls(sox.pct))+st("VIX",fmt(vix.price,1),vix.price>25?"down":vix.price<16?"up":"")+st("หุ้นเหนือ SMA50",`${above}/${stocks.length}`)+st("สัญญาณขาขึ้น",`${bull}/${stocks.length}`)+st("ข่าวบวก / ลบ",`${nc.pos} / ${nc.neg}`)+st("ใกล้โซนรับ",`${stocks.filter(s=>s.zones&&(s.zones.status==="in"||s.zones.status==="near")).length}/${stocks.length}`)+bubbleStat(data);
  };
  paintTop();
  document.getElementById("app").innerHTML=overviewSection(data)+newsStrip(data)+stocksSection(data.groups.find(g=>g.detail===true))+zonesSection(stocks)+fundSection(stocks)+macroSection(data)+bubbleSection(data)+portfolioSection(data)+analysisHTML(data)+newsSection(data);
  bindNews(data.news||[]);
  bindMacro(data);
  bindOverview(data);
  bindStrip();
  bindPortfolio(data);
  const searchable=[...stocks,...data.groups.filter(g=>g.detail==="search").flatMap(g=>g.items)];
  const openStock=sym=>{const d=searchable.find(s=>s.symbol===sym);if(d){dlgBody.innerHTML=detail(d);dlg.showModal()}};
  const open=el=>openStock(el.closest("tr[data-sym]")?.dataset.sym);
  bindSearch(searchable,openStock);
  document.querySelectorAll("tr[data-sym]").forEach(tr=>{tr.onclick=()=>open(tr);tr.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open(tr)}}});
  dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
  startQuotes(data,()=>{paintTop();repaintCards(data);repaintRows(data)});
}).catch(()=>{
  document.getElementById("headline").textContent="ยังไม่มีข้อมูล";

});
